name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Generate, test, vet, build
        run: just check

      - name: Cross-compile release binaries
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: just dist "ci-$(git rev-parse --short HEAD)"
