name: Dev release (nightly)

on:
  schedule:
    - cron: '20 1 * * *'
      timezone: 'Europe/Zagreb'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish nightly dev build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Generate code
        run: just generate

      - name: Build Linux and Windows binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/server-linux-amd64     ./cmd/server
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/server-windows-amd64.exe ./cmd/server

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view dev >/dev/null 2>&1; then
            gh release create dev --prerelease --title "dev build (nightly)" \
              --notes "Rolling dev build." --target "$GITHUB_SHA"
          fi
          gh release upload dev dist/* --clobber
          gh release edit dev --title "dev build (nightly)" \
            --notes "Rolling dev build from main. Commit: $GITHUB_SHA. Rebuilt nightly at 01:20 Europe/Zagreb."
