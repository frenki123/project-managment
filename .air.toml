root = "."
tmp_dir = "tmp"

[build]
cmd = "just build"
entrypoint = "./tmp/server"
include_ext = ["go", "templ", "sql", "css", "js"]
exclude_dir = ["tmp", "data", "internal/db", ".devenv", ".direnv"]
exclude_regex = ["_templ\\.go$"]
exclude_unchanged = true
delay = 500
kill_delay = "1s"

[misc]
clean_on_exit = true
